[package]
name = "aether-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime data-access facade and database backend composition for Aether"
build = "build.rs"

[features]
default = ["postgres"]
postgres = ["dep:aether-data-postgres", "sqlx/postgres"]
all-drivers = ["postgres"]
# In-memory repositories are test doubles. They stay out of production builds;
# test targets opt in through dev-dependencies.
test-support = ["dep:aether-wallet"]

[dependencies]
aether-ai-formats.workspace = true
aether-data-contracts.workspace = true
aether-data-postgres = { workspace = true, optional = true }
aether-cache.workspace = true
aether-wallet = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["bigdecimal", "migrate", "macros"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# The in-memory quota repository is a test double behind `cfg(test)` and needs
# the wallet types. `test-support` gates the same module for downstream test
# targets, while this dev-dependency keeps `cargo test -p aether-data` building.
aether-wallet.workspace = true
